[project]
name = 'telorax'
version = '0.1.16'
description = 'Telegram account automation platform'
readme = 'README.md'
requires-python = '>=3.11'
dependencies = [
    'fastapi>=0.115.0,<1.0',
    'uvicorn[standard]>=0.32.0,<1.0',
    'sqlalchemy[asyncio]>=2.0.36,<3.0',
    'asyncmy>=0.2.9,<1.0',
    'alembic>=1.14.0,<2.0',
    'redis>=5.2.0,<9.0',
    'telethon>=1.40.0,<2.0',
    'pydantic>=2.10.0,<3.0',
    'pydantic-settings>=2.6.0,<3.0',
    'typer>=0.27.0,<0.28.0',
    'rich>=13.9.0,<16.0',
    'dependency-injector>=4.42.0,<5.0',
    'structlog>=24.4.0,<27.0',
    'uvloop>=0.21.0; sys_platform != "win32"',
    'phonenumbers>=8.13.0,<10.0',
    'cryptography>=43.0.0,<51.0',
    'python-multipart>=0.0.18,<1.0',
    'httpx>=0.28.0,<1.0',
    'PySocks>=1.7.1,<2.0',
]

[project.optional-dependencies]
signup = [
    'uiautomator2>=3.2.0,<4.0',
]
dev = [
    'pytest>=8.3.0,<9.0',
    'pytest-asyncio>=0.24.0,<2.0',
    'pytest-cov>=6.0.0,<8.0',
    'ruff>=0.8.0,<1.0',
    'mypy>=1.14.0,<2.0',
    'factory-boy>=3.3.0,<4.0',
]

[project.scripts]
telorax = 'telorax.cli.app:main'

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['telorax']

[tool.ruff]
line-length = 100
target-version = 'py312'
exclude = ['.github']

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I', 'N', 'UP', 'B', 'A', 'COM', 'C4', 'DTZ', 'T20', 'ICN', 'LOG', 'G', 'PIE', 'PT', 'RSE', 'SLF', 'SIM', 'TID', 'TCH', 'ARG', 'PTH', 'PL']

[tool.ruff.lint.per-file-ignores]
'tests/**' = ['PLR2004', 'PLC0415', 'SLF001', 'TC002', 'PLR0915']
'telorax/api/routes/**' = ['TC001']
'telorax/api/routes/v1/accounts.py' = ['TC001', 'PLR0913', 'PLR0917', 'B008']
'telorax/api/routes/v1/mobile_agent.py' = ['TC001', 'PLR0913', 'PLR0917', 'B008']
'telorax/api/middleware/**' = ['TC001']
'telorax/api/dependencies.py' = ['TC001', 'TC002']
'telorax/application/dto/**' = ['TC001', 'TC003']
'telorax/application/validators/**' = ['TC001', 'PLR2004']
'telorax/application/services/account_service.py' = ['TC001']
'telorax/domain/**' = ['TC001', 'TC003']
'telorax/bootstrap/application.py' = ['PLC0415']
'telorax/cli/console.py' = ['T201', 'PLC0415', 'PLR0911', 'PLR0912', 'TC003', 'SIM105']
'telorax/cli/menu.py' = ['T201', 'PLR0912', 'PLR2004', 'E501']
'telorax/cli/actions.py' = ['T201', 'PLC0415', 'TC001']
'telorax/cli/app.py' = ['PLC0415']
'telorax/cli/commands/migrate.py' = ['PLC0415']
'telorax/cli/commands/service.py' = ['PLC0415']
'telorax/cli/commands/serve.py' = ['PLC0415']
'telorax/cli/commands/upgrade.py' = ['PLC0415']
'telorax/cli/commands/config.py' = ['PLC0415']
'telorax/infrastructure/database/models/*' = ['TC003']
'telorax/infrastructure/database/repositories/sqlalchemy_repositories.py' = ['E501']
'telorax/infrastructure/telegram/session_importer.py' = ['PLR0912', 'PLR0915', 'E501', 'PLC0415', 'B904']
'telorax/infrastructure/telegram/fluxsession/**' = ['PLR2004', 'PLW1508', 'E501']
'telorax/api/routes/v1/provisioning.py' = ['TC001', 'PLR0913', 'PLR0917', 'B008']
'telorax/extensions/signup/android/uiautomator.py' = ['PLC0415', 'SLF001', 'TC001', 'ARG002', 'E501']
'telorax/extensions/signup/android_agent.py' = ['SLF001', 'PLR2004', 'E501']
'telorax/cli/commands/signup_agent.py' = ['PLC0415']

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 4
max-branches = 8
max-statements = 30

[tool.mypy]
python_version = '3.12'
strict = true
plugins = ['pydantic.mypy']

[[tool.mypy.overrides]]
module = [
    'telorax.infrastructure.telegram.fluxsession.*',
    'telorax.infrastructure.telegram.session_importer',
    'telorax.extensions.signup.android.uiautomator',
]
ignore_errors = true


[tool.coverage.run]
source = ['telorax']
branch = true
omit = [
    'telorax/cli/console.py',
    'telorax/cli/menu.py',
    'telorax/cli/actions.py',
    'telorax/cli/app.py',
    'telorax/cli/commands/*',
    'telorax/worker/*',
    'telorax/bootstrap/application.py',
    'telorax/extensions/*',
    'telorax/api/middleware/agent_auth.py',
    'telorax/api/routes/v1/accounts.py',
    'telorax/api/routes/v1/mobile_agent.py',
    'telorax/api/routes/v1/provisioning.py',
    'telorax/application/services/account_service.py',
    'telorax/application/services/mobile_agent_service.py',
    'telorax/application/services/provisioning_service.py',
    'telorax/application/validators/account_validator.py',
    'telorax/infrastructure/database/models/*',
    'telorax/infrastructure/database/repositories/*',
    'telorax/infrastructure/database/engine.py',
    'telorax/infrastructure/telegram/*',
    'telorax/domain/interfaces/repositories.py',
    'telorax/shared/timezone.py',
    'telorax/core/logging/setup.py',
]

[tool.coverage.report]
fail_under = 80
