name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: telorax
        run: |
          pip install -e ".[dev]"

      - name: Ruff
        working-directory: telorax
        run: ruff check .

      - name: Mypy
        working-directory: telorax
        run: mypy telorax/

      - name: Pytest
        working-directory: telorax
        run: pytest --cov=telorax --cov-report=term-missing
