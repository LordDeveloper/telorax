name: Build and Release

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write

concurrency:
  group: telorax-build-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_REPO_NAME: telorax

jobs:
  building:
    name: Building
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ "${{ github.event_name }}" = "push" ]; then
            pip install build
          fi

      - name: Ruff
        run: ruff check telorax tests

      - name: Mypy
        run: mypy telorax/

      - name: Pytest
        run: pytest --cov=telorax --cov-report=term-missing

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build API docs
        run: |
          chmod +x scripts/build-docs.sh scripts/stage-docs.sh
          scripts/build-docs.sh

      - name: Upload docs
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: telorax-docs
          path: docs/dist/
          if-no-files-found: error
          retention-days: 1

      - name: Build wheel
        if: github.event_name == 'push'
        run: |
          python -m build --wheel --outdir dist
          ls -lh dist/

      - name: Upload wheel
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: telorax-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  prepare-release:
    name: prepare-release
    needs: building
    if: >-
      ${{
        github.event_name == 'push'
        && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        && !contains(github.event.head_commit.message, '[skip ci]')
      }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ -z "${LATEST_TAG}" ]; then
            NEXT_TAG='v0.1.0'
          else
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "${VERSION}" | cut -d. -f1)
            MINOR=$(echo "${VERSION}" | cut -d. -f2)
            PATCH=$(echo "${VERSION}" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          VERSION="${NEXT_TAG#v}"
          echo "tag=${NEXT_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  package:
    name: package-${{ matrix.arch }}
    needs: [building, prepare-release]
    if: >-
      ${{
        github.event_name == 'push'
        && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        && !contains(github.event.head_commit.message, '[skip ci]')
      }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: telorax-wheel
          path: dist

      - name: Download docs
        uses: actions/download-artifact@v4
        with:
          name: telorax-docs
          path: docs/dist

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev rpm

      - name: Build packages
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          WHEEL="$(ls -1 dist/*.whl | head -n 1)"
          chmod +x scripts/package-deb.sh scripts/package-rpm.sh scripts/release-name.sh scripts/stage-docs.sh
          scripts/package-deb.sh "${VERSION}" "${ARCH}" "${WHEEL}"
          scripts/package-rpm.sh "${VERSION}" "${ARCH}" "${WHEEL}"
          ls -lh "${RELEASE_REPO_NAME}.${VERSION}-${ARCH}".*

      - name: Upload packages
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p upload
          cp "${RELEASE_REPO_NAME}.${VERSION}-${ARCH}.deb" upload/
          cp "${RELEASE_REPO_NAME}.${VERSION}-${ARCH}.rpm" upload/

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telorax-packages-${{ matrix.arch }}
          path: upload/
          if-no-files-found: error
          retention-days: 1

  releasing:
    name: Releasing new version
    needs: [prepare-release, package]
    if: >-
      ${{
        github.event_name == 'push'
        && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        && !contains(github.event.head_commit.message, '[skip ci]')
      }}
    runs-on: ubuntu-latest
    concurrency:
      group: telorax-release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: telorax-wheel
          path: release-assets

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: telorax-packages-*
          merge-multiple: true
          path: release-assets

      - name: Sync project version
        run: |
          VERSION='${{ needs.prepare-release.outputs.version }}'
          sed -i "s/^version = .*/version = '${VERSION}'/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = '${VERSION}'/" telorax/__init__.py

      - name: Assemble release bundle
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          chmod +x scripts/release-name.sh
          WHEEL_SRC="$(ls -1 release-assets/*.whl | head -n 1)"
          WHEEL_OUT="${RELEASE_REPO_NAME}.${VERSION}-any.whl"
          mv "${WHEEL_SRC}" "release-assets/${WHEEL_OUT}"
          cp scripts/install.sh release-assets/
          cp scripts/deps.sh release-assets/
          cp scripts/release-name.sh release-assets/
          (
            cd release-assets
            sha256sum "${RELEASE_REPO_NAME}.${VERSION}-"* > SHA256SUMS
          )
          ls -lh release-assets/

      - name: Commit version bump and tag
        run: |
          TAG='${{ needs.prepare-release.outputs.tag }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml telorax/__init__.py
          if ! git diff --staged --quiet; then
            git commit -m "chore: bump version to ${TAG} [skip ci]"
          fi
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: ${{ needs.prepare-release.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          body: |
            ## Packages

            Naming: `${{ env.RELEASE_REPO_NAME }}.<version>-<architecture>.<ext>`

            | Distro family | Arch | Asset |
            |---------------|------|-------|
            | Debian / Ubuntu | amd64 | `telorax.*-amd64.deb` |
            | Debian / Ubuntu | arm64 | `telorax.*-arm64.deb` |
            | RHEL / Fedora / Amazon Linux | amd64 | `telorax.*-amd64.rpm` |
            | RHEL / Fedora / Amazon Linux | arm64 | `telorax.*-arm64.rpm` |
            | Any Linux (Python 3.11+) | any | `telorax.*-any.whl` |
          files: |
            release-assets/telorax.*-any.whl
            release-assets/telorax.*-amd64.deb
            release-assets/telorax.*-arm64.deb
            release-assets/telorax.*-amd64.rpm
            release-assets/telorax.*-arm64.rpm
            release-assets/SHA256SUMS
            release-assets/install.sh
            release-assets/deps.sh
            release-assets/release-name.sh
