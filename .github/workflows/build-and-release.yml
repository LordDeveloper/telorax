name: Build and Release

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write

concurrency:
  group: telorax-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  building:
    name: Building
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ "${{ github.event_name }}" = "push" ]; then
            pip install build
          fi

      - name: Ruff
        run: ruff check telorax tests

      - name: Mypy
        run: mypy telorax/

      - name: Pytest
        run: pytest --cov=telorax --cov-report=term-missing

      - name: Build wheel
        if: github.event_name == 'push'
        run: |
          python -m build --wheel --outdir dist
          ls -lh dist/

      - name: Upload wheel
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: telorax-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  releasing:
    name: Releasing new version
    needs: building
    if: >-
      ${{
        github.event_name == 'push'
        && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        && !contains(github.event.head_commit.message, '[skip ci]')
      }}
    runs-on: ubuntu-latest
    concurrency:
      group: telorax-release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: telorax-wheel
          path: dist

      - name: Determine next version
        id: version
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ -z "${LATEST_TAG}" ]; then
            NEXT_TAG='v0.1.0'
          else
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "${VERSION}" | cut -d. -f1)
            MINOR=$(echo "${VERSION}" | cut -d. -f2)
            PATCH=$(echo "${VERSION}" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          VERSION="${NEXT_TAG#v}"
          echo "tag=${NEXT_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Sync project version
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          sed -i "s/^version = .*/version = '${VERSION}'/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = '${VERSION}'/" telorax/__init__.py

      - name: Build release assets
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          WHEEL="$(ls -1 dist/*.whl | head -n 1)"
          chmod +x scripts/package-deb.sh
          scripts/package-deb.sh "${VERSION}" amd64 "${WHEEL}"
          mkdir -p release-assets
          cp "${WHEEL}" release-assets/
          cp "telorax_${VERSION}_linux_amd64.deb" release-assets/
          cp scripts/install.sh release-assets/
          cp scripts/deps.sh release-assets/
          (
            cd release-assets
            sha256sum ./*.whl telorax_*.deb > SHA256SUMS
          )
          ls -lh release-assets/

      - name: Commit version bump and tag
        run: |
          TAG='${{ steps.version.outputs.tag }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml telorax/__init__.py
          if ! git diff --staged --quiet; then
            git commit -m "chore: bump version to ${TAG} [skip ci]"
          fi
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            release-assets/*.whl
            release-assets/telorax_*_linux_*.deb
            release-assets/SHA256SUMS
            release-assets/install.sh
            release-assets/deps.sh
