name: Build and Release

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write

concurrency:
  group: telorax-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  building:
    name: Building
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache Nuitka build
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/.cache/ccache
          key: nuitka-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'telorax/**/*.py') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ "${{ github.event_name }}" = "push" ]; then
            pip install nuitka ordered-set zstandard
          fi

      - name: Install build tools
        if: github.event_name == 'push'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-dev gcc patchelf ccache

      - name: Ruff
        run: ruff check telorax tests

      - name: Mypy
        run: mypy telorax/

      - name: Pytest
        run: pytest --cov=telorax --cov-report=term-missing

      - name: Determine next version
        if: github.event_name == 'push'
        id: version
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ -z "${LATEST_TAG}" ]; then
            NEXT_TAG='v0.1.0'
          else
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "${VERSION}" | cut -d. -f1)
            MINOR=$(echo "${VERSION}" | cut -d. -f2)
            PATCH=$(echo "${VERSION}" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          VERSION="${NEXT_TAG#v}"
          echo "tag=${NEXT_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Next release: ${NEXT_TAG}"

      - name: Sync project version
        if: github.event_name == 'push'
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          sed -i "s/^version = .*/version = '${VERSION}'/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = '${VERSION}'/" telorax/__init__.py

      - name: Build binary
        if: github.event_name == 'push'
        env:
          CCACHE_DIR: ~/.cache/ccache
        run: |
          mkdir -p dist
          python -m nuitka \
            --standalone \
            --onefile \
            --jobs=$(nproc) \
            --output-dir=dist \
            --output-filename=telorax \
            --include-package=telorax \
            telorax/cli/app.py
          chmod +x dist/telorax
          dist/telorax version

      - name: Build .deb package
        if: github.event_name == 'push'
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          ARCH='amd64'
          PKG_ROOT="telorax_${VERSION}_linux_${ARCH}"
          mkdir -p "${PKG_ROOT}/DEBIAN" "${PKG_ROOT}/usr/local/bin" "${PKG_ROOT}/etc/telorax" "${PKG_ROOT}/lib/systemd/system" "${PKG_ROOT}/usr/share/telorax"

          cp dist/telorax "${PKG_ROOT}/usr/local/bin/telorax"
          cp packaging/telorax.service "${PKG_ROOT}/lib/systemd/system/telorax.service"
          cp packaging/env.example "${PKG_ROOT}/etc/telorax/env.example"
          cp scripts/deps.sh "${PKG_ROOT}/usr/share/telorax/deps.sh"
          chmod 755 "${PKG_ROOT}/usr/share/telorax/deps.sh"

          {
            echo 'Package: telorax'
            echo "Version: ${VERSION}"
            echo 'Section: utils'
            echo 'Priority: optional'
            echo "Architecture: ${ARCH}"
            echo 'Maintainer: Telorax Team'
            echo 'Description: Telegram account automation platform'
          } > "${PKG_ROOT}/DEBIAN/control"

          cat > "${PKG_ROOT}/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          mkdir -p /etc/telorax
          if [ ! -f /etc/telorax/.env ]; then
            cp /etc/telorax/env.example /etc/telorax/.env
            chmod 600 /etc/telorax/.env
          fi
          systemctl daemon-reload || true
          EOF
          chmod 755 "${PKG_ROOT}/DEBIAN/postinst"

          dpkg-deb --build "${PKG_ROOT}"
          mv "${PKG_ROOT}.deb" "telorax_${VERSION}_linux_${ARCH}.deb"

      - name: Prepare release assets
        if: github.event_name == 'push'
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          mkdir -p release-assets
          cp dist/telorax release-assets/telorax
          cp "telorax_${VERSION}_linux_amd64.deb" release-assets/
          cp scripts/install.sh release-assets/
          cp scripts/deps.sh release-assets/
          (
            cd release-assets
            sha256sum telorax telorax_*.deb > SHA256SUMS
          )
          echo "${{ steps.version.outputs.tag }}" > release-assets/RELEASE_TAG.txt

      - name: Upload release assets
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/
          retention-days: 1

  releasing:
    name: Releasing new version
    needs: building
    if: >-
      ${{
        github.event_name == 'push'
        && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        && !contains(github.event.head_commit.message, '[skip ci]')
      }}
    runs-on: ubuntu-latest
    concurrency:
      group: telorax-release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Read release tag
        id: version
        run: |
          TAG=$(tr -d '\r\n' < release-assets/RELEASE_TAG.txt)
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Sync project version
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          sed -i "s/^version = .*/version = '${VERSION}'/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = '${VERSION}'/" telorax/__init__.py

      - name: Commit version bump and tag
        run: |
          TAG='${{ steps.version.outputs.tag }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml telorax/__init__.py
          if ! git diff --staged --quiet; then
            git commit -m "chore: bump version to ${TAG} [skip ci]"
          fi
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin main
          git push origin "${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            release-assets/telorax
            release-assets/telorax_*_linux_*.deb
            release-assets/SHA256SUMS
            release-assets/install.sh
            release-assets/deps.sh
